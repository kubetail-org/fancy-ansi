name: publish

on:
  push:
    tags:
      - '**'

jobs:
  publish:
    if: github.repository == 'kubetail-org/fancy-ansi'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm trusted publishing
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
      - uses: pnpm/action-setup@v6
      - run: pnpm install
      - run: pnpm build
      # The tag is the source of truth for the version (e.g. v1.2.3, v1.2.3-rc1)
      - run: npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version --allow-same-version
      - run: |
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then dist_tag=next; else dist_tag=latest; fi
          pnpm publish --no-git-checks --access public --tag "$dist_tag"
